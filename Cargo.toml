[package]
name = "wallet-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
# ========== CRITTOGRAFIA ==========
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
bip39 = "2.0"
rand = "0.8"
hex = "0.4"

# ========== DATABASE ==========
rusqlite = { version = "0.30", features = ["bundled"] }

# ========== SERIALIZZAZIONE ==========
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# ========== NETWORKING (SENZA OPENSSL) ==========
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["rt", "macros", "net"] }

# tungstenite con rustls - feature corretta: "rustls" o "__rustls-tls"
tungstenite = { version = "0.20", default-features = false, features = ["rustls"] }

# ========== UTILITY ==========
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# ========== PYTHON FFI ==========
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"], optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
pyo3-build-config = "0.20"