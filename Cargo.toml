[package]
name = "wallet-core"
version = "0.1.0"
edition = "2021"
authors = ["PAX Wallet Team"]
description = "Core Rust per PAX Wallet - Crittografia, Database, Reticulum, Trustline"
license = "MIT"
repository = "https://github.com/yourusername/pax-wallet"

[features]
default = ["python"]
python = ["dep:pyo3"]

[dependencies]
# ========== CRITTOGRAFIA ==========
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
bip39 = "2.0"
rand = "0.8"
hex = "0.4"
base58 = "0.2"
ecdsa = "0.16"
secp256k1 = { version = "0.27", features = ["rand", "recovery"] }
aes = "0.8"
ctr = "0.9"
chacha20 = "0.9"
pbkdf2 = "0.12"
hmac = "0.12"
hkdf = "0.12"
# ========== CRITTOGRAFIA PER CIFRATURA ==========
aes-gcm = "0.10"
base64 = "0.21"
# ========== DATABASE ==========
rusqlite = { version = "0.30", features = ["bundled"] }

# ========== SERIALIZZAZIONE ==========
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# ========== NETWORKING (SENZA OPENSSL) ==========
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.35", features = ["rt", "macros", "net", "time"] }
tungstenite = { version = "0.20", default-features = false, features = ["rustls"] }

# ========== UTILITY ==========
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
url = "2.4"

# ========== PYTHON FFI ==========
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"], optional = true }

[lib]
crate-type = ["cdylib", "rlib"]
name = "wallet_core"

[build-dependencies]
pyo3-build-config = "0.20"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[workspace]
members = ["."]
resolver = "2"